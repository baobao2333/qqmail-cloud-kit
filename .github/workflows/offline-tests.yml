name: Offline synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without live mailbox or OAuth
        run: python -B -m unittest discover -s tests -v
      - name: Build checked source ZIP and checksum
        run: python -B scripts/build_release.py
